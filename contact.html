    <div class="page-content fade-in">
        <div class="section-heading-wrap">
            <h1 class="section-heading" style="color:#46f862; border:2px solid #46f862;">Contact Me</h1>
        </div>

        <div class="contact-layout">
            <div class="contact-form-wrap">
                <!-- Replace YOUR_ID with your actual Formspree form ID -->
                <form method="POST" action="https://formspree.io/f/YOUR_ID">
                    <div>
                        <label for="Name">Your Full Name</label>
                        <input type="text" id="Name" name="Name" required>
                    </div>
                    <div>
                        <label for="Email">Your Email Address</label>
                        <input type="email" id="Email" name="Email" required>
                    </div>
                    <div>
                        <label for="Message">Your Message</label>
                        <textarea id="Message" name="Message" rows="6" maxlength="3000" required></textarea>
                    </div>
                    <button type="submit" class="btn-send">Send Message</button>
                </form>
                <p class="works-cited">
                    <a href="https://docs.google.com/document/d/1XIU5Pp6925IwmFXY56qRgQ1cghBn5CrrQR8RPCuV5GU/edit?usp=sharing" target="_blank">Works Cited</a>
                </p>
            </div>

            <div class="contact-socials">
                <a href="https://www.linkedin.com/in/tyoshi-chikayama-jackson/" target="_blank" rel="noopener noreferrer" class="social-item">
                    <img src="assets/download (1).png" alt="LinkedIn logo">
                    <span>LinkedIn</span>
                </a>
                <a href="https://github.com/TyoshiChikayama-Jackson/portfolio-nextech" target="_blank" rel="noopener noreferrer" class="social-item">
                    <img src="assets/download (2).png" alt="GitHub logo">
                    <span>GitHub</span>
                </a>
                <div class="social-item" style="cursor:default;">
                    <img src="assets/download (3).png" alt="Email icon">
                    <span>tyoshijackson@gmail.com</span>
                </div>
            </div>
        </div>
    </div>
</body>
